    - region "PHASE C — SHAPE, PROOF, AND BAKE":
      - heading "PHASE C — SHAPE, PROOF, AND BAKE" [level=2]
      - list
      - heading "Method" [level=3]
      - list:
        - listitem: Divide the dough into two, pre-shape, rest 30 min, shape, and proof 2–3 h at room temperature or overnight in the refrigerator.
        - listitem: Preheat a lidded casserole at 240 C for at least 20 min.
        - listitem: Bake each scored loaf covered, uncover for the final 10 min, and cool completely before slicing.
      - heading "Technique Applications" [level=3]
      - table:
        - rowgroup:
          - row "Technique Controls Purpose":
            - columnheader "Technique"
            - columnheader "Controls"
            - columnheader "Purpose"
        - rowgroup:
          - row "Staged baking Bake covered then uncover for the last 10 min; total about 40 min at 240 C. Allow spring before browning the crust.":
            - cell "Staged baking":
              - link "Staged baking":
                - /url: /techniques/staged-baking/
            - cell "Bake covered then uncover for the last 10 min; total about 40 min at 240 C."
            - cell "Allow spring before browning the crust."
      - heading "Principles" [level=3]
      - list:
        - listitem:
          - link "Steam-assisted oven spring":
            - /url: /principles/steam-assisted-oven-spring/
          - text: — Covered baking delays crust setting during expansion.
        - listitem:
          - link "Maillard reaction":
            - /url: /principles/maillard-reaction/
          - text: — The uncovered finish browns the crust.
      - heading "Phase Outputs Used" [level=3]
      - table:
        - rowgroup:
          - row "Phase Output Use":
            - columnheader "Phase Output"
            - columnheader "Use"
        - rowgroup:
          - row "Bulk-fermented dough Divide bulk-dough, pre-shape, rest, shape, proof, and score.":
            - cell "Bulk-fermented dough"
            - cell "Divide bulk-dough, pre-shape, rest, shape, proof, and score.":
