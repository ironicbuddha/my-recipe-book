    - region "PHASE B — MIX AND DEVELOP DOUGH":
      - heading "PHASE B — MIX AND DEVELOP DOUGH" [level=2]
      - heading "Ingredient Uses" [level=3]
      - list:
        - listitem:
          - link "Bread flour":
            - /url: /ingredients/bread-flour/
          - paragraph: Mix into the dough.
          - term: Quantity
          - definition: 1000 g
          - term: Scaling
          - definition: 90.91%
        - listitem:
          - link "Water":
            - /url: /ingredients/water/
          - paragraph: Use 600 g to hydrate the flour and reserve 40 g to dissolve salt.
          - term: Quantity
          - definition: 640 g
          - term: Scaling
          - definition: 58.18%
        - listitem:
          - link "Salt":
            - /url: /ingredients/salt/
          - paragraph: Dissolve in the additional water.
          - term: Quantity
          - definition: 20 g
          - term: Scaling
          - definition: 1.82%
      - heading "Method" [level=3]
      - list:
        - listitem: Combine water, ripe levain, and flour; cover and rest.
        - listitem: Dissolve salt in the additional water, mix it into the dough, and perform three stretch-and-fold sets.
        - listitem: Let the dough bulk ferment until visibly aerated.
      - heading "Technique Applications" [level=3]
      - table:
        - rowgroup:
